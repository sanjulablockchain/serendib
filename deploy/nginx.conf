# === serendibhealthways.com ===
# Appended to /etc/nginx/sites-available/apps-proxy on the shared Lightsail box (3.19.170.142).
# The app container listens on 127.0.0.1:8220. The certificate is a Cloudflare Origin CA
# certificate for serendibhealthways.com and *.serendibhealthways.com (Full strict mode).
# Port 80 is handled by the box's existing default_server, which redirects to https.

# Bare domain: send to www, which is the canonical address.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name serendibhealthways.com;
    ssl_certificate     /etc/ssl/serendib/origin.pem;
    ssl_certificate_key /etc/ssl/serendib/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    return 301 https://www.serendibhealthways.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.serendibhealthways.com;
    ssl_certificate     /etc/ssl/serendib/origin.pem;
    ssl_certificate_key /etc/ssl/serendib/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Visitor IP for the contact form rate limit, trusted only from Cloudflare.
    # Ranges from https://www.cloudflare.com/ips-v4 and ips-v6.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header   CF-Connecting-IP;

    location / {
        proxy_pass         http://127.0.0.1:8220;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        # Overwritten, never passed through: the app trusts X-Real-IP only.
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
    }
}
